<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
        }

        header {
            background: #0077cc;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        button {
            background: #0077cc;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Website</h1>
</header>

<main>
    <p>This is my very first website!</p>
    <button onclick="sayHello()">Click Me</button>
</main>

<script>
function sayHello() {
    alert("Hello! Thanks for visiting.");
}
</script>

</body>
</html>
